name: Azure CI Lab

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

env:
  APP_NAME: Git-Lab
  ENVIRONMENT: Lab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run CI test
        run: |
          echo "GitHub Actions CI pipeline started"
          echo "Repository checkout successful"
          if [ -f README.md ]; then echo "README.md exists - CI test passed"; else echo "README.md missing - CI test failed"; exit 1; fi

      - name: Display environment variables
        run: |
          echo "Application Name: $APP_NAME"
          echo "Environment: $ENVIRONMENT"

      - name: Test GitHub secret
        env:
          LAB_SECRET: ${{ secrets.LAB_SECRET }}
        run: |
          if [ -n "$LAB_SECRET" ]; then
            echo "GitHub secret is available - secret test passed"
          else
            echo "GitHub secret is missing - secret test failed"
            exit 1
          fi

      - name: Generate CI report
        run: |
          echo "GitHub Actions CI Report" > ci-report.txt
          echo "Application: $APP_NAME" >> ci-report.txt
          echo "Environment: $ENVIRONMENT" >> ci-report.txt
          echo "CI validation completed successfully" >> ci-report.txt

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-report
          path: ci-report.txt
  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy application
        run: |
          echo "Starting deployment..."
          echo "Build completed successfully"
          echo "CI artifact is ready"
          echo "Deployment to Azure would happen here"
          echo "Deployment completed successfully"