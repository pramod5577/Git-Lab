name: Azure CI Lab

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run CI test
        run: |
          echo "GitHub Actions CI pipeline started"
          echo "Repository checkout successful"
          echo "CI test completed successfully"